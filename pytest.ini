[pytest]
addopts = -rA --capture=tee-sys --durations=5
# Show prints live in the terminal *and* keep them in pytest’s captured output
markers =
    fast: fast, deterministic tests
    e2e: end-to-end CLI/system tests
    network: tests requiring network access
    notebook: notebook execution tests that must run in the conda dev environment
    sphinx: local-only docs/linkcheck tests
    local: local-only tests that depend on local fixture data
    serial
log_format = %(asctime)s.%(levelname)s.%(name)s:  %(message)s
log_date_format = %M:%S
pythonpath = .  
testpaths = tests  
