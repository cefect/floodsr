version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_build:
      # Regenerate CLI docs from live help text before Sphinx reads the source tree.
      - python docs/user/scripts/build_cli_reference.py --output docs/user/cli_reference.rst

sphinx:
  configuration: docs/user/conf.py

python:
  install:
    - requirements: container/docs/requirements.overlay.txt
