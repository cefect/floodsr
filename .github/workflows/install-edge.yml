name: Install Edge

on:
  # Run the expanded install-context matrix only when requested.
  workflow_dispatch:

permissions:
  # Read-only is sufficient for checkout and artifact reuse.
  contents: read

concurrency:
  # Keep one manual edge run per ref active at a time.
  group: install-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-artifacts:
    name: build wheel and sdist (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Fetch repository contents for packaging.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Install a consistent Python runtime for packaging.
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Build artifacts once and reuse them across install-context jobs.
      - name: Build artifacts
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      # Upload the wheel and sdist for downstream smoke jobs.
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v6
        with:
          name: python-dist
          path: dist/*

  basic-pipx:
    name: basic pipx (${{ matrix.os }} / ${{ matrix.gdal_context }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: build-artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gdal_context: no_system_gdal
            expect_gdal_config_installed: "false"
            expected_gdal_config_version: "__none__"
          - os: ubuntu-latest
            gdal_context: unsupported_system_gdal
            expect_gdal_config_installed: "true"
            expected_gdal_config_version: "0.0.0"
          - os: ubuntu-latest
            gdal_context: supported_system_gdal
            expect_gdal_config_installed: "true"
            expected_gdal_config_version: "3.12.2"
          - os: windows-latest
            gdal_context: no_system_gdal
            expect_gdal_config_installed: "false"
            expected_gdal_config_version: "__none__"
          - os: windows-latest
            gdal_context: unsupported_system_gdal
            expect_gdal_config_installed: "true"
            expected_gdal_config_version: "0.0.0"
          - os: windows-latest
            gdal_context: supported_system_gdal
            expect_gdal_config_installed: "true"
            expected_gdal_config_version: "3.12.2"

    steps:
      # Install a consistent Python runtime for isolated smoke envs.
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Fetch the previously built artifacts instead of rebuilding from source.
      - name: Download dist artifacts
        uses: actions/download-artifact@v5
        with:
          name: python-dist
          path: dist

      # Install pipx and expose the default local bin path for this job.
      - name: Install pipx
        shell: bash
        run: |
          python -m pip install --upgrade pip pipx
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "$APPDATA/Python/Python312/Scripts" >> "$GITHUB_PATH"
          else
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      # Simulate host GDAL visibility without installing Python GDAL into the pipx env.
      - name: Configure host GDAL context (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "${{ matrix.gdal_context }}" = "no_system_gdal" ]; then
            exit 0
          fi

          mkdir -p fake-bin
          if [ "${{ matrix.gdal_context }}" = "supported_system_gdal" ]; then
            GDAL_VERSION="3.12.2"
          else
            GDAL_VERSION="0.0.0"
          fi

          cat > fake-bin/gdal-config <<EOF
          #!/usr/bin/env bash
          if [ "\$1" = "--version" ]; then
            echo "${GDAL_VERSION}"
            exit 0
          fi
          exit 1
          EOF
          chmod +x fake-bin/gdal-config

          echo "$PWD/fake-bin" >> "$GITHUB_PATH"

      # Simulate host GDAL visibility using Windows-native command discovery.
      - name: Configure host GDAL context (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ matrix.gdal_context }}" -eq "no_system_gdal") {
            exit 0
          }

          $fakeBin = Join-Path $PWD "fake-bin"
          New-Item -ItemType Directory -Force -Path $fakeBin | Out-Null
          if ("${{ matrix.gdal_context }}" -eq "supported_system_gdal") {
            $gdalVersion = "3.12.2"
          } else {
            $gdalVersion = "0.0.0"
          }

          @"
          @echo off
          if "%1"=="--version" (
            echo $gdalVersion
            exit /b 0
          )
          exit /b 1
          "@ | Set-Content -Path (Join-Path $fakeBin "gdal-config.cmd") -Encoding ascii

          $fakeBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Smoke test the basic install from the built wheel in an isolated pipx env.
      - name: pipx install built core wheel
        shell: bash
        run: |
          WHEEL=$(echo dist/*.whl)
          python -m pipx install --force "$WHEEL"

      # Verify console entrypoint and basic no-input CLI paths in the requested host context.
      - name: Smoke test basic CLI (unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          EXPECT_GDAL_CONFIG_INSTALLED: ${{ matrix.expect_gdal_config_installed }}
          EXPECTED_GDAL_CONFIG_VERSION: ${{ matrix.expected_gdal_config_version }}
        run: |
          floodsr --help
          floodsr doctor --json > doctor.json
          floodsr models list
          python - <<'PY'
          import json, os
          from pathlib import Path

          payload = json.loads(Path("doctor.json").read_text(encoding="utf-8"))
          expect_config = os.environ["EXPECT_GDAL_CONFIG_INSTALLED"] == "true"
          expected_version = os.environ["EXPECTED_GDAL_CONFIG_VERSION"]

          assert payload["gdal"]["python_bindings_installed"] is False
          assert payload["gdal"]["vrt_enabled"] is False
          assert payload["gdal"]["gdal_config_installed"] is expect_config
          if expected_version == "__none__":
              assert payload["gdal"]["gdal_config_version"] is None
          else:
              assert payload["gdal"]["gdal_config_version"] == expected_version
          PY

      # Verify console entrypoint and basic no-input CLI paths in the requested Windows host context.
      - name: Smoke test basic CLI (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECT_GDAL_CONFIG_INSTALLED: ${{ matrix.expect_gdal_config_installed }}
          EXPECTED_GDAL_CONFIG_VERSION: ${{ matrix.expected_gdal_config_version }}
        run: |
          floodsr --help
          floodsr doctor --json | Set-Content -Path doctor.json -Encoding utf8
          floodsr models list
          python -c "import json, os, pathlib; payload = json.loads(pathlib.Path('doctor.json').read_text(encoding='utf-8')); expect_config = os.environ['EXPECT_GDAL_CONFIG_INSTALLED'] == 'true'; expected_version = os.environ['EXPECTED_GDAL_CONFIG_VERSION']; assert payload['gdal']['python_bindings_installed'] is False; assert payload['gdal']['vrt_enabled'] is False; assert payload['gdal']['gdal_config_installed'] is expect_config; assert (payload['gdal']['gdal_config_version'] is None) if expected_version == '__none__' else (payload['gdal']['gdal_config_version'] == expected_version)"

  extended-conda:
    name: extended conda (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-artifacts

    steps:
      # Fetch the previously built artifacts instead of rebuilding from source.
      - name: Download dist artifacts
        uses: actions/download-artifact@v5
        with:
          name: python-dist
          path: dist

      # Provide a Linux conda environment for the documented extended install path.
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: floodsr-gdal
          auto-activate-base: false
          channels: conda-forge
          python-version: "3.12"

      # Install GDAL first in the target conda environment, then install floodsr with pip.
      - name: Install extended dependencies and wheel
        run: |
          conda install -n floodsr-gdal -c conda-forge gdal -y
          WHEEL=$(echo dist/*.whl)
          conda run -n floodsr-gdal python -m pip install --upgrade pip
          conda run -n floodsr-gdal python -m pip install "$WHEEL"

      # Verify the extended install reports GDAL-backed VRT support.
      - name: Smoke test extended CLI
        run: |
          conda run -n floodsr-gdal floodsr doctor --json > doctor-extended.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("doctor-extended.json").read_text(encoding="utf-8"))
          assert payload["gdal"]["python_bindings_installed"] is True
          assert payload["gdal"]["vrt_enabled"] is True
          PY
