  publish-testpypi:
    name: publish pre-release to TestPyPI
    runs-on: ubuntu-latest
    needs: [fast-tests, build-artifacts, core-install-smoke]
    if: contains(github.ref_name, 'rc') || contains(github.ref_name, 'a') || contains(github.ref_name, 'b')
    environment: testpypi
    permissions:
      # Trusted Publishing needs OIDC only on publish jobs.
      id-token: write
      contents: read

    steps:
      # Download the already validated release artifacts.
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      # Publish the pre-release artifacts to TestPyPI via Trusted Publishing.
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: publish stable release to PyPI
    runs-on: ubuntu-latest
    needs: [fast-tests, build-artifacts, core-install-smoke]
    if: ${{ !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') }}
    environment: pypi
    permissions:
      # Trusted Publishing needs OIDC only on publish jobs.
      id-token: write
      contents: read

    steps:
      # Download the already validated release artifacts.
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      # Publish the stable artifacts to PyPI via Trusted Publishing.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: create or update GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-testpypi, publish-pypi]
    if: ${{ always() && (needs.publish-testpypi.result == 'success' || needs.publish-pypi.result == 'success') }}
    permissions:
      # Creating GitHub Releases requires write access to repository contents.
      contents: write

    steps:
      # Create or update the GitHub Release from the same tag used for publishing.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'a') || contains(github.ref_name, 'b') }}
