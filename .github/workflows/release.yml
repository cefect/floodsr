name: Release

on:
  # Publish only from explicit version tags.
  push:
    tags:
      - "v*"

permissions:
  # Default release workflow permissions remain read-only until publish/release jobs.
  contents: read

concurrency:
  # Keep one release run per tag active at a time.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag-origin:
    name: verify tag commit is on master (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Fetch full history so tag reachability checks are accurate.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Ensure the tagged commit is reachable from master before publishing.
      - name: Verify tag commit is on master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

  fast-tests:
    name: fast tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify-tag-origin

    steps:
      # Fetch repository contents for test execution.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install a consistent Python runtime.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install system GDAL so the extended test environment can import osgeo.gdal.
      - name: Install system GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      # Install runtime and test dependencies required by the release fast suite.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "gdal==$(gdal-config --version)"
          python -m pip install -e ".[dev,extended]"

      # Run the CI-safe fast suite only.
      - name: Run fast tests
        run: |
          pytest -m "fast and not local and not sphinx"

  build-artifacts:
    name: build wheel and sdist (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify-tag-origin

    steps:
      # Fetch full history so setuptools-scm can derive the tagged release version.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install a consistent Python runtime for packaging.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Build both artifacts, validate metadata, and assert the derived version matches the tag.
      - name: Build artifacts
        run: |
          python -m pip install --upgrade pip build twine packaging
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          import os
          import zipfile
          from email.parser import Parser
          from pathlib import Path

          tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          wheel_fp = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel_fp) as zf:
              metadata_name = next(name for name in zf.namelist() if name.endswith(".dist-info/METADATA"))
              metadata = Parser().parsestr(zf.read(metadata_name).decode("utf-8"))
          built_version = metadata["Version"]
          assert built_version == tag_version, f"built_version={built_version} != tag_version={tag_version}"
          print(f"validated built version {built_version} against tag v{tag_version}")
          PY

      # Reuse the same artifacts across release validation and publish jobs.
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  core-install-smoke:
    name: core wheel smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-artifacts

    steps:
      # Install a consistent Python runtime for isolated smoke envs.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fetch the previously built artifacts instead of rebuilding from source.
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      # Install pipx and expose the default local bin path for this job.
      - name: Install pipx
        run: |
          python -m pip install --upgrade pip pipx
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Smoke test the core install from the built wheel in an isolated pipx env.
      - name: pipx install built core wheel
        run: |
          WHEEL=$(echo dist/*.whl)
          python -m pipx install --force "$WHEEL"

      # Verify console entrypoint and basic no-input CLI paths.
      - name: Smoke test core CLI
        run: |
          floodsr --help
          floodsr doctor
          floodsr models list

      # Confirm the built wheel remains importable without GDAL bindings installed.
      - name: Verify optional GDAL import path
        run: |
          WHEEL=$(echo dist/*.whl)
          python -m venv .venv-core
          . .venv-core/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "$WHEEL"
          python - <<'PY'
          import floodsr.dem_sources.hrdem_mosaic
          assert floodsr.dem_sources.hrdem_mosaic.gdal is None
          print("core import validated without osgeo.gdal")
          PY

