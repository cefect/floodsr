[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "floodsr"
dynamic = ["version"]
description = "Flood super-resolution CLI and library using ONNX Runtime."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "floodsr developers" }]
dependencies = [
    "geopandas>=1.1",
    "numpy>=1.24",
    "onnxruntime>=1.18",
    "platformdirs>=4.0",
    "pystac-client>=0.9",
    "pydantic>=2.5",
    "rasterio>=1.3",
    "tqdm>=4.0",
    "typer>=0.12",
]

[project.optional-dependencies]
extended = ["gdal>=3.6"]
dev = ["build>=1.2", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "setuptools-scm[toml]>=8", "twine>=6.0"]

[project.scripts]
floodsr = "floodsr.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["floodsr*"]

[tool.setuptools.package-data]
floodsr = ["models.json"]

[tool.setuptools_scm]
local_scheme = "no-local-version"
tag_regex = "^v(?P<version>.+)$"
version_scheme = "guess-next-dev"
