[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "floodsr"
dynamic = ["version"]
description = "Flood super-resolution CLI and library using ONNX Runtime."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CEFlood" }]
dependencies = [
    "geopandas>=1.1,<2",
    "numpy>=2,<3",
    "onnxruntime>=1.22,<2",
    "platformdirs>=4,<5",
    "pystac-client>=0.9,<0.10",
    "rasterio>=1.5,<2",
    "shapely>=2,<3",
    "tqdm>=4,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=4.0",
]

[project.scripts]
floodsr = "floodsr.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["floodsr*"]

[tool.setuptools.package-data]
floodsr = ["models.json"]

[tool.setuptools_scm]
local_scheme = "no-local-version"
tag_regex = "^v(?P<version>.+)$"
version_scheme = "guess-next-dev"
